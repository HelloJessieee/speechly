<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Speechly articulation guide</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #eef3ed; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
      color: #375444; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; }
    #status.hidden { display: none; }
  </style>
</head>
<body>
<div id="status" role="status">Loading 3D guide…</div>
<script>
  const status = document.getElementById('status');
  window.addEventListener('speechly-ready', () => status.classList.add('hidden'));
  window.addEventListener('error', () => { status.textContent = '3D preview unavailable. Use the sound tips below.'; });
  setTimeout(() => {
    if (!window.speechlyReady) status.textContent = '3D preview is taking longer than expected.';
  }, 8000);
</script>
<script src="bundle.js"></script>
</body>
</html>
