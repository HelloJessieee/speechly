# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# then open MouthCoach.xcodeproj.
name: MouthCoach
options:
  bundleIdPrefix: edu.stanford
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: B9M4XA2WH8
targets:
  MouthCoach:
    type: application
    platform: iOS
    sources:
      - path: MouthCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hellojessieee.speechmirror
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    info:
      path: MouthCoach/Info.plist
      properties:
        CFBundleDisplayName: MouthCoach
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: MouthCoach shows your camera so you can watch your mouth while you practice. Video stays on your device unless you ask for Claude feedback.
        NSMicrophoneUsageDescription: MouthCoach records practice attempts for playback and sends them to your configured Mac service for automatic speech recognition after recording.
        NSLocalNetworkUsageDescription: MouthCoach connects to your Mac Speech Mirror service when you generate a sentence reference or analyze a recording.
        # The MouthCoach server that calls Claude. The Simulator can reach the
        # dev server on the same Mac at localhost; on an iPhone use the Mac's
        # address (see ios/README.md). Use HTTPS for any deployed server.
        MouthCoachFeedbackServerURL: http://localhost:5173
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  MouthCoach:
    build:
      targets:
        MouthCoach: all
    run:
      config: Debug
